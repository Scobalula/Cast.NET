name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build src/Cast.NET.slnx -c Release

      - name: Test
        run: dotnet test --solution src/Cast.NET.slnx -c Release --no-build

      - name: Verify with reference Python library
        if: runner.os == 'Linux'
        run: |
          curl -fsSL "https://raw.githubusercontent.com/dtzxporter/cast/$(cat .github/cast-upstream.txt)/libraries/python/cast.py" -o .github/cast.py
          timeout 120 python3 .github/interop.py src/Cast.NET.Tests/bin/Release/net10.0/interop
